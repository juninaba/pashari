# Publishes Pashari on GitHub Releases.
#
# Pushing a tag such as v0.1.0 builds the app, packs it as a .dmg and a .zip
# (Scripts/package-release.sh), and publishes a release with both. The tag
# must match the app's version, MARKETING_VERSION in Config/Base.xcconfig.
#
# Pull requests that change the release setup build and pack the app the
# same way without publishing it. The files are kept with the workflow run.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Scripts/package-release.sh

permissions:
  contents: read

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - run: Scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            build/release/Pashari-*.dmg
            build/release/Pashari-*.zip
          if-no-files-found: error

  # A separate job, so that only this one, which runs no build tools, can
  # write to the repository.
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if [ ! -f "Pashari-$version.dmg" ] || [ ! -f "Pashari-$version.zip" ]; then
            echo "::error::Tag $TAG does not match the app's version. Built: $(ls Pashari-*.dmg)"
            exit 1
          fi
          gh release create "$TAG" "Pashari-$version.dmg" "Pashari-$version.zip" \
            --verify-tag \
            --title "Pashari $version" \
            --generate-notes \
            --notes "Pashari is not notarized by Apple, so macOS blocks it the first time you open it. See [Installing]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY#installing) for how to open it."
