# Builds Pashari and runs the PashariTests unit test suite on pull requests
# and pushes to main.
#
# Suites that capture or record the real screen skip automatically when the
# runner does not have the Screen Recording permission.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        run: |
          # Vision's accurate text recognition cannot load its Neural Engine models on this runner.
          xcodebuild test \
            -scheme Pashari \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build/DerivedData-ci \
            -skip-testing:PashariTests/TextRecognizerTests \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
